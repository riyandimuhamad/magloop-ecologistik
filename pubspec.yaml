name: magloop_ecologistik
description: Magloop Ecologistik - Platform manajemen logistik hijau untuk mitra HOREKA dan Dapur MBG.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.6
  google_maps_flutter: ^2.5.3
  cloud_firestore: ^4.14.0
  firebase_core: ^2.24.2
  mobile_scanner: ^5.1.0
  lottie: ^3.1.0
  google_generative_ai: ^0.4.4
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
